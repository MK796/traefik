name: Publish recursive-watch release

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Stable upstream v3 tag. Empty selects the newest stable tag.
        required: false
        type: string

concurrency:
  group: downstream-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  packages: write

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_short: ${{ steps.candidate.outputs.candidate_short }}
      changed: ${{ steps.select.outputs.changed }}
      patchset_id: ${{ steps.select.outputs.patchset_id }}
      patchset_short: ${{ steps.select.outputs.patchset_short }}
      source_tag: ${{ steps.select.outputs.source_tag }}
      upstream_sha: ${{ steps.candidate.outputs.upstream_sha }}
      upstream_tag: ${{ steps.select.outputs.upstream_tag }}

    steps:
      - name: Check out known-good downstream
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: downstream/recursive-watch
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "MK796 Traefik downstream bot"
          git config user.email "95221524+MK796@users.noreply.github.com"

      - name: Select stable upstream release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/traefik/traefik.git
          else
            git remote add upstream https://github.com/traefik/traefik.git
          fi
          git fetch --no-tags upstream master
          git fetch --force upstream 'refs/tags/*:refs/tags/*'

          official_releases_file="${RUNNER_TEMP}/official-traefik-releases.json"
          downstream_releases_file="${RUNNER_TEMP}/completed-downstream-releases.json"
          gh api --paginate --jq '.[]' 'repos/traefik/traefik/releases?per_page=100' \
            | jq --slurp '.' > "${official_releases_file}"
          gh api --paginate --jq '.[]' "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq --slurp '.' > "${downstream_releases_file}"

          upstream_tag="$(./script/downstream/select-release-tag.sh \
            "${official_releases_file}" "${downstream_releases_file}" "${REQUESTED_TAG}")"
          if ! [[ "${upstream_tag}" =~ ^v3\.[0-9]+\.[0-9]+$ ]]; then
            echo "No stable Traefik v3 release tag was selected." >&2
            exit 1
          fi

          patch_base_sha="$(git merge-base HEAD refs/remotes/upstream/master)"
          patchset_id="$(./script/downstream/patchset-id.sh "${patch_base_sha}" HEAD)"
          patchset_short="${patchset_id:0:12}"
          source_tag="downstream-${upstream_tag}-recursive.${patchset_short}"

          release_asset="$(gh release view "${source_tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | select(.name == "downstream-release.json") | .name' 2>/dev/null || true)"
          if [ "${release_asset}" = "downstream-release.json" ]; then
            changed=false
          else
            changed=true
          fi

          {
            echo "upstream_tag=${upstream_tag}"
            echo "patchset_id=${patchset_id}"
            echo "patchset_short=${patchset_short}"
            echo "source_tag=${source_tag}"
            echo "changed=${changed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare patched release candidate
        id: candidate
        if: steps.select.outputs.changed == 'true'
        env:
          CANDIDATE_BRANCH: automation/release-${{ steps.select.outputs.upstream_tag }}-${{ github.run_id }}
          UPSTREAM_TAG: ${{ steps.select.outputs.upstream_tag }}
        run: ./script/downstream/prepare-release-candidate.sh

      - name: Verify release patch identity
        if: steps.select.outputs.changed == 'true'
        env:
          ACTUAL_PATCHSET: ${{ steps.candidate.outputs.patchset_id }}
          EXPECTED_PATCHSET: ${{ steps.select.outputs.patchset_id }}
        run: test "${ACTUAL_PATCHSET}" = "${EXPECTED_PATCHSET}"

  verify:
    name: Verify release candidate
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/downstream-verify.yaml
    with:
      candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
      upstream_sha: ${{ needs.prepare.outputs.upstream_sha }}

  publish:
    name: Publish immutable release image
    needs:
      - prepare
      - verify
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/downstream-image.yaml
    with:
      candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
      image_tag: ${{ needs.prepare.outputs.upstream_tag }}-recursive.${{ needs.prepare.outputs.patchset_short }}
      upstream_ref: ${{ needs.prepare.outputs.upstream_tag }}
      upstream_sha: ${{ needs.prepare.outputs.upstream_sha }}

  finalize:
    name: Record verified release
    needs:
      - prepare
      - verify
      - publish
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Publish immutable source tag
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
        run: |
          git config user.name "MK796 Traefik downstream bot"
          git config user.email "95221524+MK796@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${SOURCE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
            test "$(git rev-parse "refs/tags/${SOURCE_TAG}^{commit}")" = "${CANDIDATE_SHA}"
          else
            git tag --annotate "${SOURCE_TAG}" --message "Verified downstream for ${{ needs.prepare.outputs.upstream_tag }}"
            git push origin "refs/tags/${SOURCE_TAG}"
          fi

      - name: Publish immutable release manifest
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          PATCHSET_ID: ${{ needs.prepare.outputs.patchset_id }}
          SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          release_directory="${RUNNER_TEMP}/downstream-release"
          release_manifest="${release_directory}/downstream-release.json"
          release_notes="${release_directory}/release-notes.md"
          mkdir -p "${release_directory}"

          # shellcheck disable=SC2016
          jq --null-input \
            --arg candidate_sha "${CANDIDATE_SHA}" \
            --arg image "${IMAGE_REF}@${IMAGE_DIGEST}" \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg image_ref "${IMAGE_REF}" \
            --arg patchset_id "${PATCHSET_ID}" \
            --arg source_tag "${SOURCE_TAG}" \
            --arg upstream_sha "${UPSTREAM_SHA}" \
            --arg upstream_tag "${UPSTREAM_TAG}" \
            '{schema_version:1,candidate_sha:$candidate_sha,image:$image,image_ref:$image_ref,image_digest:$image_digest,patchset_id:$patchset_id,source_tag:$source_tag,upstream_sha:$upstream_sha,upstream_tag:$upstream_tag}' \
            > "${release_manifest}"

          {
            echo "Verified recursive-watch downstream for Traefik ${UPSTREAM_TAG}."
            echo
            echo "- Source tag: \`${SOURCE_TAG}\`"
            echo "- Image: \`${IMAGE_REF}@${IMAGE_DIGEST}\`"
            echo "- Upstream: \`${UPSTREAM_TAG}\` at \`${UPSTREAM_SHA}\`"
            echo "- Patchset: \`${PATCHSET_ID}\`"
          } > "${release_notes}"

          if gh release view "${SOURCE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing_directory="${RUNNER_TEMP}/existing-downstream-release"
            mkdir -p "${existing_directory}"
            if gh release download "${SOURCE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern downstream-release.json --dir "${existing_directory}" >/dev/null 2>&1; then
              cmp "${release_manifest}" "${existing_directory}/downstream-release.json"
            else
              gh release upload "${SOURCE_TAG}" "${release_manifest}" --repo "${GITHUB_REPOSITORY}"
            fi
          else
            gh release create "${SOURCE_TAG}" "${release_manifest}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Traefik ${UPSTREAM_TAG} recursive-watch downstream" \
              --notes-file "${release_notes}" \
              --verify-tag
          fi

          cat "${release_notes}" >> "${GITHUB_STEP_SUMMARY}"

  report-failure:
    name: Report blocked release
    needs:
      - prepare
      - verify
      - publish
      - finalize
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure' || needs.finalize.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create or update release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag || 'unknown' }}
        run: |
          title="Downstream release blocked for ${UPSTREAM_TAG}"
          body="The verified image was not published. Workflow: ${RUN_URL}"
          issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number --jq '.[0].number')"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

  close-failure-report:
    name: Close resolved release issue
    needs:
      - prepare
      - finalize
    if: ${{ always() && needs.prepare.result == 'success' && (needs.prepare.outputs.changed != 'true' || needs.finalize.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Close open release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          for title in "Downstream release blocked for ${UPSTREAM_TAG}" "Downstream release blocked for unknown"; do
            issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number --jq '.[0].number')"
            if [ -n "${issue_number}" ]; then
              gh issue close "${issue_number}" --repo "${GITHUB_REPOSITORY}" --comment "Release checks recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            fi
          done
