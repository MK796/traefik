name: File provider recursive watch exhaustion

on:
  push:
    branches:
      - test/file-provider-recursive-watch-exhaustion
  workflow_dispatch:

concurrency:
  group: file-provider-recursive-watch-exhaustion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-tests:
    name: Provider tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TRAEFIK_FILE_WATCH_EXHAUSTION: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          check-latest: true

      - name: Run complete file-provider package
        if: runner.os != 'Windows'
        run: go test ./pkg/provider/file -count=1 -timeout=15m

      - name: Run recursive watcher tests on Windows
        if: runner.os == 'Windows'
        run: go test ./pkg/provider/file -run "^(TestProvideWatchRecursively|TestProvideWatchExhaustion.*|TestRecursiveFileWatcher.*)$" -count=1 -timeout=15m

      - name: Repeat lifecycle and edge tests
        run: go test ./pkg/provider/file -run "^(TestProvideWatchRecursively|TestRecursiveFileWatcher.*)$" -count=25 -timeout=20m

      - name: Repeat exhaustion tests
        run: go test ./pkg/provider/file -run "^Test.*Exhaustion" -count=5 -timeout=30m

  race-tests:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRAEFIK_FILE_WATCH_EXHAUSTION: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          check-latest: true

      - name: Repeat tests with race detector
        run: go test -race ./pkg/provider/file -run "^(TestProvideWatchRecursively|TestProvideWatchExhaustion.*|TestRecursiveFileWatcher.*)$" -count=5 -timeout=35m

  regression-tests:
    name: Full regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          check-latest: true

      - name: Run complete Traefik unit suite
        run: go test -parallel 8 ./cmd/... ./pkg/...

      - name: Build Traefik
        run: go build ./cmd/traefik
